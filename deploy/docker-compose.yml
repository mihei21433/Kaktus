# Сервер «Кактуса»: API + PostgreSQL + Caddy (HTTPS-сертификат выпускается автоматически).
# Запуск: из папки deploy — docker compose up -d --build
# Обычно запускать руками не нужно: сервер обновляется сам (deploy/auto-update.sh, см. docs/deploy.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaktus
      POSTGRES_USER: kaktus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaktus -d kaktus']
      interval: 10s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://kaktus:${POSTGRES_PASSWORD}@db:5432/kaktus
      PORT: '3000'
      UPLOAD_DIR: /app/uploads
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?задайте API_DOMAIN в .env}
      APP_DOMAIN: ${APP_DOMAIN:-app.vectorfamily.kz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  uploads:
