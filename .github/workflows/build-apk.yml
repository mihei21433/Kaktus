# Новый APK — нужен, только когда меняется «нативная» часть (новые разрешения, модули, версия Expo).
# Запускается вручную: Actions → «Сборка APK» → Run workflow. Ссылка на APK — в итогах запуска.
name: Сборка APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    name: APK (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Собрать на серверах Expo
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EAS_NO_VCS: '1'
          EAS_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Нет секрета EXPO_TOKEN"; exit 1; }
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "::error::Нет секрета GOOGLE_SERVICES_JSON"; exit 1; }
          # тот же файл, что и при обновлениях по воздуху, — иначе обновления не подойдут к сборке
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          npm ci
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > build.json
          node -e '
            const b = JSON.parse(require("fs").readFileSync("build.json", "utf8"))[0];
            const url = b.artifacts?.buildUrl ?? b.artifacts?.applicationArchiveUrl;
            console.log("APK:", url); console.log("Сборка:", b.id);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### APK готов\n\n- Скачать: ${url}\n- Все сборки и QR-коды: expo.dev → проект kaktus → Builds\n`);
          '
